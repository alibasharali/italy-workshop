name: Claude Code Review

# Uavhengig AI-review på hver PR, mot repoets egne regler og storyens spec.
# Klassene står i docs/agents/review-policy.md:
#   Auto-fix         → Claude committer rettelsen (fix(review): …) til PR-branchen og nevner den i oppsummeringen
#   Trenger menneske → inline-kommentar = uløst tråd, og rulesettet blokkerer merge til den er løst
# Ikke en påkrevd sjekk (kvote/nedetid skal ikke blokkere merge).
# NB: claude-code-action nekter å kjøre hvis en PR endrer denne filen — endre den i en egen PR.

on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]

concurrency:
  group: claude-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  claude-review:
    # Aldri på PR-er fra forks: reviewen har skrivetilgang til branchen
    if: github.event.pull_request.draft == false && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: read
      id-token: write

    steps:
      - name: Checkout PR-branchen
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 20

      # Reviewens egen rettelse trigger en ny kjøring — ikke review den på nytt
      - name: Hopp over hvis siste commit er en auto-fix
        id: guard
        run: |
          if git log -1 --format=%s | grep -q '^fix(review):'; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "Siste commit er en auto-fix fra reviewen, hopper over."
          fi

      - uses: actions/setup-dotnet@v6
        if: steps.guard.outputs.skip != 'true'
        with:
          dotnet-version: 10.0.x

      - uses: actions/setup-node@v7
        if: steps.guard.outputs.skip != 'true'
        with:
          node-version: 24

      - name: Run Claude Code Review
        if: steps.guard.outputs.skip != 'true'
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}
            BRANCH: ${{ github.head_ref }} (already checked out; push fixes here)

            You are the independent reviewer for a team that works spec-driven with AI agents.
            Read the diff with `gh pr diff` and the description with `gh pr view` first.

            Review against, in this order:
            1. `AGENTS.md` and any `AGENTS.md` / `.claude/rules/*.md` in the folders the diff touches.
            2. `docs/agents/workflow.md`: the definition of done and the guardrails.
            3. The story's spec, if the PR links one (`docs/specs/<issue>-*.md`): acceptance criteria,
               domain decisions and "Out of scope". Every AC implemented and tested, nothing out of scope built.

            Report only real, specific problems you are confident about: correctness bugs and edge cases,
            breaches of documented conventions, security, missing tests or tests changed to pass,
            docs that disagree with the code. Formatting and taste are out of bounds, and so is praise.

            Classify every finding with `docs/agents/review-policy.md`. Read it before acting:
            - **Auto-fix:** make the fix, run the checks the policy names, then
              `git add` + `git commit -m "fix(review): <what>"` (one commit per finding) and `git push`.
              If a check goes red, revert your change and treat the finding as Needs a human instead.
            - **Needs a human:** an inline comment on the right line with
              mcp__github_inline_comment__create_inline_comment: what is wrong and your recommended fix.

            Finish with one PR comment (`gh pr comment`) in Norwegian:
            1. a verdict line: «Klar for merge» (nothing left for a human), «Må fikses» or «Trenger avklaring»
            2. «Fikset automatisk»: one line per fix, with the short commit SHA. Remind the author to `git pull`.
            3. «Trenger et menneske»: one line per inline comment.
            If you find nothing, say so in one sentence. Write all comments in Norwegian.
          claude_args: |
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*),Read,Grep,Glob,Edit,Write,Bash(git add:*),Bash(git commit:*),Bash(git push:*),Bash(git status:*),Bash(git diff:*),Bash(git log:*),Bash(git checkout -- :*),Bash(dotnet restore:*),Bash(dotnet build:*),Bash(dotnet test:*),Bash(dotnet format:*),Bash(npm ci:*),Bash(npm run lint:*)"
