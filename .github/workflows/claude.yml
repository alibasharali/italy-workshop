name: Claude Code

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  issues:
    types: [opened, assigned]
  pull_request_review:
    types: [submitted]

jobs:
  claude:
    if: |
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review' && contains(github.event.review.body, '@claude')) ||
      (github.event_name == 'issues' && (contains(github.event.issue.body, '@claude') || contains(github.event.issue.title, '@claude')))
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
      issues: read
      id-token: write
      actions: read # Required for Claude to read CI results on PRs
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Run Claude Code
        id: claude
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}

          # This is an optional setting that allows Claude to read CI results on PRs
          additional_permissions: |
            actions: read

          # Ingen prompt: Claude gjør det som står i kommentaren med @claude.
          # --append-system-prompt legger repoets regler oppå, uten å erstatte kommentaren.
          # Verktøyene lar Claude verifisere egne endringer før den pusher.
          claude_args: |
            --allowedTools "Bash(dotnet restore:*),Bash(dotnet build:*),Bash(dotnet test:*),Bash(dotnet format:*),Bash(npm ci:*),Bash(npm run lint:*)"
            --append-system-prompt "You work in a repo with a spec-driven agent workflow. Follow AGENTS.md (and any nested AGENTS.md or .claude/rules/ in the folders you touch) and docs/agents/workflow.md. Hard rules from docs/agents/review-policy.md: never change a test to make it pass; never edit the spec in docs/specs/, .github/workflows/, .claude/settings.json or .claude/hooks/. If the request would require that, explain why and stop. Before pushing, build and run the fast tests (Domain, Application, Architecture; plus npm run lint for frontend changes). Commit with a descriptive message, not prefixed fix(review):, so the review runs again. When you answer a review thread, say what you changed with the commit SHA, and remind the human to resolve the thread themselves. Write your replies in Norwegian."

